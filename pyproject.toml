[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes: undefined names, unused imports, redefinitions (catches F811)
    "I",      # isort: import ordering
    "UP",     # pyupgrade: modern Python syntax
    "B",      # flake8-bugbear: likely bugs and design issues
    "BLE",    # flake8-blind-exception: broad except must be suppressed with noqa: BLE001
    "PL",     # pylint: broad rule set including PLC0415 (import-outside-toplevel)
    "SIM",    # flake8-simplify: unnecessary if/else, return bool directly
    "PERF",   # perflint: performance anti-patterns (e.g. append in loop vs extend)
    "C4",     # flake8-comprehensions: unnecessary list()/dict() calls
    "PTH",    # flake8-use-pathlib: prefer pathlib over os.path / open()
    "A",      # flake8-builtins: no shadowing of builtins (type, id, list …)
    "G",      # flake8-logging-format: lazy % args in logger calls (no f-strings)
    "RSE",    # flake8-raise: raise with parentheses (raise ValueError() not raise ValueError)
    "RET",    # flake8-return: no superfluous else after return; clean return paths
    "T20",    # flake8-print: no print() statements in production code
    "ISC",    # flake8-implicit-str-concat: catch accidental "foo" "bar" concatenation
    "ASYNC",  # flake8-async: async anti-patterns (blocking calls in async functions)
    "PIE",    # flake8-pie: misc improvements (no unnecessary pass, dict merge, etc.)
    "PT",     # flake8-pytest-style: pytest best practices (match= on raises, etc.)
    "RUF100", # ruff: unused noqa directives
]
ignore = [
    # Line length handled per-project style (coordinator.py has long lines intentionally)
    "E501",
    # Magic numbers are common in BLE byte parsing
    "PLR2004",
    # Complexity limits – coordinator is intentionally dense
    "PLR0912",
    "PLR0913",
    "PLR0915",
    # Too many positional arguments – BLE command signatures and test helpers are
    # inherently positional (added in ruff 0.16; the project predates it)
    "PLR0917",
    "PLR1702",
    # Loop variable reassignment (part = part.strip()) is an acceptable idiom here
    "PLW2901",
    # TYPE_CHECKING blocks are not used in this HA integration pattern
    "TC001",
    "TC002",
    "TC003",
    # En-dashes in docstrings/comments are intentional style
    "RUF002",
    "RUF003",
    # asyncio.TimeoutError alias (UP041) requires Python 3.11+; keep explicit for clarity
    "UP041",
]

[tool.ruff.lint.per-file-ignores]
# Tests import freely and may redefine names for readability
"tests/*" = ["F401", "F811", "PLC0415"]
# Lazy imports are intentional: aioesphomeapi is optional (proxy-only),
# device_registry and recorder API must be loaded at runtime
"custom_components/oclean_ble/coordinator.py" = ["PLC0415"]
"custom_components/oclean_ble/statistics.py" = ["PLC0415"]
# Standalone CLI tools: print() is the UI, broad excepts are deliberate
# (a missing GATT characteristic must not abort the capture), and the style
# rules below would only add churn.  Pyflakes (F) stays enabled so undefined
# names and dead code are still caught.
"tools/*" = [
    "T201",   # print in CLI output
    "BLE001", # blind except around best-effort GATT calls
    "PLC0415",# lazy imports to keep startup cheap
    "ASYNC250", "ASYNC230", "ASYNC240", "ASYNC109", "ASYNC110",  # interactive CLI helpers
    "PTH123", "PTH120", "PTH118",  # plain open()/os.path is fine here
    "PERF401", "SIM105", "SIM103", "PLR1714", "PLR0911", "ISC004", "I001",
]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false

