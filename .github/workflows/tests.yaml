name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          # Home Assistant 2026.9.1 requires Python >= 3.14.2
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Verify target Home Assistant version
        run: python -c "import homeassistant.const as c; assert c.__version__ == '2026.9.1', c.__version__; print('HA', c.__version__)"
      - name: Lint (ruff)
        run: ruff check custom_components/ tests/ tools/
      - name: Type check (mypy)
        run: mypy custom_components/oclean_ble/ --ignore-missing-imports
      - name: Run tests
        run: pytest --tb=short
