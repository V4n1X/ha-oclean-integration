name: Secret scan

# Guards against credentials / private data ever reaching the repository.
# Runs on every push and pull request; needs no secrets of its own.

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history so the scan covers past commits too
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

  no-personal-data:
    # This integration must not contain account credentials, tokens, MAC
    # addresses of real devices or captured user logs.  The check fails on
    # anything that looks like a real credential or a captured session dump.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for committed credentials / captured data
        run: |
          set -euo pipefail
          fail=0

          # 1. No credential files at all
          if git ls-files | grep -Ei '(^|/)(\.env|secrets\.ya?ml|.*\.(pem|key|p12|pfx|jks|keystore)|id_(rsa|ed25519)|credentials\.json|.*token.*\.json)$'; then
            echo "::error::credential-looking file is tracked"
            fail=1
          fi

          # 2. No hard-coded bearer tokens / API keys / private keys
          if git grep -nEI '(BEGIN [A-Z ]*PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.)' -- . ':!*.md' ':!.github/workflows/secret-scan.yml'; then
            echo "::error::possible hard-coded secret"
            fail=1
          fi

          # 3. No captured BLE logs of real devices
          if git ls-files | grep -Ei '(oclean_ble\.log|\.log$|logs/)'; then
            echo "::error::log file is tracked"
            fail=1
          fi

          exit "$fail"
