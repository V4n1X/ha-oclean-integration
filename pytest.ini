[pytest]
asyncio_mode = auto
# Matches Home Assistant core's own pytest configuration and removes the
# "asyncio_default_fixture_loop_scope unset" warning of pytest-asyncio >= 1.4.
asyncio_default_fixture_loop_scope = function
testpaths = tests
addopts = --cov=custom_components/oclean_ble --cov-report=term-missing --cov-fail-under=81
